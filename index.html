<!-- Performance Mode (auto-enable for Windows / low-memory devices) -->
<style>
  /* Minimal overrides for low-end Performance Mode on the homepage */
  body.low-end::before{ animation:none !important; background:none !important; }
  .festive-mandala-bg{ animation:none !important; opacity:0.6 !important; }
  .poster-showcase-card, .poster-card, .poster-img-box img{ transition:none !important; }
  .poster-card:hover{ transform:none !important; box-shadow:none !important; }
  .veil, .veil.run{ animation:none !important; }
  .splash-particles, .splash-particle, .splash-orb, .splash-ring, .orb, .ring{ animation:none !important; }
  .poster-showcase-card, .poster-card, .dl-card, .plaque, .direct-card{ box-shadow:none !important; }
  body.low-end *{ backface-visibility: hidden; will-change: auto !important; }
  body.low-end img, body.low-end video{ image-rendering: optimizeSpeed !important; }
  /* reduce heavy gradients and backdrop filters */
  body.low-end .rail, body.low-end .veil, body.low-end .poster-modal-content, body.low-end .posters-section{ backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }
  /* hide decorative background overlay */
  body.low-end .festive-mandala-bg{ display:none !important; }
  /* slightly reduce animation durations and frequencies as fallback */
  @media (prefers-reduced-motion: reduce){ body, body *{ animation-duration:0.001s !important; transition-duration:0.001s !important; } }
</style>

<script>
  (function(){
    try {
      const stored = localStorage.getItem('bharat.performanceMode');
      if (stored === 'off') return; // user explicitly disabled

      const ua = navigator.userAgent || '';
      const platform = navigator.platform || '';
      const isWindows = /Win(dows)?/.test(platform) || /Windows/.test(ua);
      const deviceMemory = navigator.deviceMemory || 0; // in GB
      const hc = navigator.hardwareConcurrency || 0; // logical cores

      // Criteria to enable performance mode automatically:
      // - Windows desktop OR deviceMemory <= 2GB OR hardwareConcurrency <= 2
      const enable = isWindows || (deviceMemory > 0 && deviceMemory <= 2) || (hc > 0 && hc <= 2);

      if (enable) {
        document.documentElement.classList.add('low-end');
        document.body && document.body.classList.add('low-end');
        try { localStorage.setItem('bharat.performanceMode', 'auto'); } catch(e){}
      }

      // Add a small unobtrusive toggler in bottom-left so user can turn off if they want
      function insertToggle(){
        const badge = document.createElement('button');
        badge.id = 'perfToggleBtn';
        badge.title = 'Performance Mode is enabled automatically for a smoother experience. Click to toggle.';
        badge.style.position = 'fixed';
        badge.style.left = '12px';
        badge.style.bottom = '12px';
        badge.style.zIndex = 9999;
        badge.style.padding = '8px 10px';
        badge.style.borderRadius = '10px';
        badge.style.border = '1px solid rgba(255,201,60,0.22)';
        badge.style.background = 'rgba(20,15,43,0.78)';
        badge.style.color = 'var(--marigold, #ffc93c)';
        badge.style.fontSize = '12px';
        badge.style.cursor = 'pointer';
        badge.style.backdropFilter = 'blur(6px)';
        badge.style.boxShadow = '0 6px 16px rgba(0,0,0,0.5)';
        badge.textContent = document.documentElement.classList.contains('low-end') ? 'Perf Mode: On' : 'Perf Mode: Off';

        badge.addEventListener('click', function(){
          const isOn = document.documentElement.classList.toggle('low-end');
          if (isOn) {
            localStorage.setItem('bharat.performanceMode','on');
            badge.textContent = 'Perf Mode: On';
          } else {
            localStorage.setItem('bharat.performanceMode','off');
            badge.textContent = 'Perf Mode: Off';
          }
        });
        document.body.appendChild(badge);
      }

      // If DOM already ready, insert; otherwise wait
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', insertToggle, { once:true });
      } else {
        insertToggle();
      }

      // Defer heavy third-party library initializations if not on app page
      // (these functions may not exist on homepage, but safe guards)
      window.__deferHeavyInit = function(){
        // Example: if mermaid initialization exists, defer until user opens the tools
        if (window.mermaid && window.mermaid.initialize) {
          // don't auto-init
        }
      };

    } catch(e){ console.warn('PerfMode guard error', e); }
  })();
</script>

<style>
  /* Additional defensive styles to reduce repaints on Windows */
  .poster-showcase-card{ will-change: transform; }
  .poster-img-wrapper, .poster-img-box{ transform: translateZ(0); }
</style>
