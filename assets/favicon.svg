<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f1c"/>
      <stop offset="50%" stop-color="#ffc93c"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>
    <linearGradient id="bvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181236"/>
      <stop offset="100%" stop-color="#0e0a1f"/>
    </linearGradient>
    <filter id="bvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle (like Apple / OpenAI / Claude icons) -->
  <rect width="100" height="100" rx="24" fill="url(#bvBg)"/>
  <rect width="100" height="100" rx="24" fill="none" stroke="rgba(255,201,60,0.18)" stroke-width="1.5"/>

  <!-- Iconic Voice Wave + Flame + AI Spark -->
  <g filter="url(#bvGlow)">
    <!-- Voice Wave flowing into Flame Base -->
    <path d="M 22 50 
             C 24 50, 25 43, 27 43 
             C 29 43, 30 57, 32 57 
             C 34 57, 35 36, 37 36 
             C 39 36, 40 64, 42 64 
             C 44 64, 45 42, 47 42 
             C 49 42, 50 67, 56 71 
             C 63 75, 71 73, 76 67 
             C 80 62, 81 55, 78 49
             C 76 46, 73 45, 73 42
             C 73 39, 75 36, 74 31
             C 71 35, 68 39, 66 40
             C 64 35, 66 27, 63 23
             C 61 27, 58 33, 56 38
             C 52 47, 50 58, 55 64
             C 58 68, 65 69, 70 65
             C 73 62, 75 57, 73 52" 
          fill="none" 
          stroke="url(#bvGrad)" 
          stroke-width="3.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner AI Sparkle Star -->
    <path d="M 64 47
             Q 64 53, 70 53
             Q 64 53, 64 59
             Q 64 53, 58 53
             Q 64 53, 64 47 Z" 
          fill="url(#bvGrad)"/>
  </g>
</svg>
