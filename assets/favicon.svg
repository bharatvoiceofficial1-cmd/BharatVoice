<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081c13"/>
      <stop offset="100%" stop-color="#030c08"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="100" height="100" rx="24" fill="url(#bvBg)"/>
  <rect width="100" height="100" rx="24" fill="none" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5"/>

  <!-- Waveform Ribbon -->
  <g filter="url(#bloom)">
    <path d="M 18 50 C 26 50, 28 32, 34 32 C 40 32, 42 68, 48 68 C 54 68, 56 22, 62 22 C 68 22, 70 76, 76 76 C 80 76, 82 50, 86 50" 
          fill="none" 
          stroke="url(#waveGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Secondary Harmonic Ribbon -->
    <path d="M 22 50 C 28 50, 32 38, 38 38 C 44 38, 46 62, 52 62 C 58 62, 62 30, 68 30 C 74 30, 78 65, 82 50" 
          fill="none" 
          stroke="rgba(255, 255, 255, 0.6)" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Luminous Core Node -->
    <circle cx="62" cy="22" r="3" fill="#ffffff"/>
  </g>
</svg>
